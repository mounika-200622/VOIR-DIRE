<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULB Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
            text-transform: uppercase;
            font-size: 14px;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .status {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
        }
        .status-open {
            background-color: #f39c12;
            color: white;
        }
        .status-closed {
            background-color: #27ae60;
            color: white;
        }
        .status-REOPENED {
            background-color: #e74c3c;
            color: white;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <h1>ULB Complaints Dashboard</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Asset ID</th>
                <th>Kind</th>
                <th>Severity</th>
                <th>Reported At</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="complaints-body">
            <!-- Data will be populated here -->
        </tbody>
    </table>

    <script>
        async function fetchComplaints() {
            try {
                const response = await fetch('/api/complaints');
                const complaints = await response.json();
                const tbody = document.getElementById('complaints-body');
                tbody.innerHTML = '';
                
                complaints.forEach(c => {
                    const tr = document.createElement('tr');
                    
                    const statusClass = `status-${c.status}`;
                    
                    tr.innerHTML = `
                        <td>${c.id}</td>
                        <td>${c.asset_id}</td>
                        <td>${c.kind}</td>
                        <td>${c.severity}</td>
                        <td>${new Date(c.reported_at).toLocaleString()}</td>
                        <td><span class="status ${statusClass}">${c.status}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching complaints:', error);
            }
        }

        fetchComplaints();
        setInterval(fetchComplaints, 2000); // refresh quickly for demo purposes
    </script>
</body>
</html>
